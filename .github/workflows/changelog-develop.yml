name: Changelog (develop)

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      since:
        description: '(optional) diff start commit SHA — leave empty to use the previous commit. Use to recover a failed run or reprocess a range.'
        required: false
        type: string

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write

jobs:
  changelog:
    if: "${{ github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, '📝 chore: update changelog') }}"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Update CHANGELOG.md via GitHub Models
        env:
          # Personal PAT — GITHUB_TOKEN (bot account) doesn't get the rate
          # limit benefit of a personal Copilot subscription, so a
          # models:read PAT is registered as GH_MODELS_PAT instead.
          GITHUB_TOKEN: ${{ secrets.GH_MODELS_PAT }}
          BEFORE_SHA: ${{ github.event.inputs.since || github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: node .github/scripts/update-changelog.mjs

      - name: Check for changelog changes
        id: changes
        run: |
          if git status --porcelain -- CHANGELOG.md | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit changelog update
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "📝 chore: update changelog"
          git push
